<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão Gamer da Isabella</title>
    <style>
        /* =======================================================
           SEU DESAFIO COMEÇA AQUI! Escreva as regras abaixo:
           ======================================================= */

        /* PASSO 1: Deixe o fundo da página (body) escuro (ex: #121212) 
           e a cor de todos os textos branca para parecer um painel de jogos. */
body{
background-color: #121212;
color: aquamarine;
li::marker{
  color: blueviolet; 
}

a:link{
   background-color: aquamarine;
   padding: 0.8em 1.5em;
   text-decoration: none;
   color: aliceblue;

}
a:visited{
   color: blueviolet;
}


a:hover{
  color: crimson;
}

a:active{
   color: chartreuse;
}
}

              
        /* PASSO 3: Estilize o seu botão/link (.btn-jogar):
           - Dê a ele uma cor de fundo (background-color).
           - Use 'em' para o padding (ex: padding: 0.8em 1.5em) para ele ficar proporcional.
           - Remova o sublinhado padrão do link usando: text-decoration: none;
           - Deixe a cor do texto do botão branca. */


        /* PASSO 4: Use a pseudoclasse :hover no seu botão para que ele 
           mude de cor quando você passar o mouse por cima! */


        /* PASSO 5: Use a pseudoclasse :active para que o botão 
           mude para outra cor diferente no exato momento do clique! */


    </style>
</head>
<body>

    <div class="cartao">
        <h2>🎮 Isabella's Gaming Club</h2>
        <p>Eu tenho 21 aninhos e esses são os meus jogos favoritos do momento:</p>
        
        <ul>
            <li>The Sims</li>
            <li>Minecraft</li>
            <li>Valorant</li>
        </ul>

        <br>

        <!-- Este é o link que você vai estilizar para parecer um botão -->
        <a class="btn-jogar" href="#">Iniciar Jogo</a>
    </div>

</body>
</html
